<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>木蘭詩｜天降文字雨 V2.0 拖曳填字試玩</title>
<style>
:root{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#242d3b;background:#edf2f8}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}.shell{max-width:940px;margin:auto;padding:12px 12px 30px}.header{text-align:center;margin:8px 0 12px}.header h1{margin:0;font-size:clamp(22px,4.7vw,32px)}.sub{color:#65748a;font-size:14px;margin:6px 0}.stats{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;font-size:14px;flex-wrap:wrap}.pill{background:#dfe8f7;border-radius:12px;padding:6px 11px;font-weight:700}.panel{background:white;border-radius:18px;padding:13px;box-shadow:0 8px 30px #15284913}.stage{display:grid;grid-template-columns:minmax(115px,230px) 1fr;gap:13px;align-items:center}.art{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:13px;background:#f6f1e6}.desc{font-size:13px;color:#637389}.headline{font-weight:900;font-size:20px;margin:5px 0}.hintline{font-size:14px;line-height:1.7;color:#55667d}.rain{position:relative;margin-top:12px;height:clamp(235px,40vh,390px);overflow:hidden;border-radius:16px;background:radial-gradient(ellipse at 50% 10%,#2c476a,#142438 80%);touch-action:pan-y;border:2px solid #41607c}.rain::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px);background-size:100% 45px}.drop{position:absolute;left:0;top:0;width:44px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid #ffffff50;color:white;font-size:27px;font-weight:800;box-shadow:0 3px 14px #0005;user-select:none;-webkit-user-select:none;touch-action:none;will-change:transform;z-index:2;padding:0}.glyph{display:block;pointer-events:none}.pulse .glyph{animation:pulse 1.8s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.24)}}
.drop:active{filter:brightness(1.6)}.drop.dragging{opacity:.23}
.slot.drop-target{outline:3px solid #ffd166;outline-offset:2px;background:#ffefb8;transform:scale(1.08)}
.slot.selected-target{outline:3px solid #66b6ff;outline-offset:2px}
.drag-ghost{position:fixed;left:0;top:0;width:55px;height:57px;z-index:99999;pointer-events:none;display:flex;align-items:center;justify-content:center;border:2px solid #fff6b3;border-radius:13px;background:#26547a;color:white;font-size:31px;font-weight:900;box-shadow:0 8px 25px #0008;transform:translate(-50%,-50%);}
.drag-ghost::after{content:"↓";position:absolute;top:48px;color:#ffc65c;font-size:23px}
.drop.selected{outline:3px solid #ffd166;filter:brightness(1.4)}
.rainLabel{position:absolute;z-index:3;left:12px;top:10px;font-size:12px;color:#b8cee0;pointer-events:none}.answer{margin-top:12px}.answer h2{font-size:15px;margin:5px 0 8px}.sentence{display:flex;gap:5px;flex-wrap:wrap;align-items:center;justify-content:center;min-height:92px;background:#f7f9fd;border:1px solid #dae2f0;border-radius:14px;padding:12px 9px;line-height:1.5}.char{min-width:26px;height:43px;display:inline-flex;align-items:center;justify-content:center;font-size:clamp(20px,4vw,28px);font-weight:750}.punct{min-width:12px}.slot{min-width:39px;height:45px;border:2px dashed #7e96be;border-radius:8px;background:#e7eefc;color:#1d518b;box-shadow:0 1px 1px #0001}.slot.filled{border:2px solid #729ad0;background:#d8e9fa}.slot.locked{border:2px solid #45a474;background:#d5f2e1;color:#21784c;cursor:default}.slot:not(.locked):active{transform:scale(.97)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#315c9e;color:white}.btn.alt{background:#e6edf7;color:#325477}.feedback{font-weight:800;min-height:26px;margin-top:8px;color:#235c86}.progress{height:7px;background:#e4eaf5;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#6d9bdb;transition:width .3s}.end{display:none;text-align:center;padding:30px 12px}.end h2{font-size:26px}.muted{font-size:12px;color:#7e899b}.footer{margin-top:12px;text-align:center;color:#8694a5;font-size:12px}
@media(max-width:540px){.shell{padding:7px 7px 22px}.panel{padding:8px;border-radius:12px}.stage{grid-template-columns:104px 1fr;gap:9px}.headline{font-size:17px}.art{border-radius:9px}.hintline{font-size:12px}.rain{height:clamp(260px,43vh,365px);margin-top:9px}.char{font-size:21px;min-width:20px;height:36px}.slot{min-width:34px;height:38px}.sentence{gap:3px;padding:9px 4px;min-height:85px}.drop{width:42px;height:46px}.stats{font-size:12px}.header h1{font-size:23px}.sub{font-size:12px}}
@media(prefers-reduced-motion:reduce){.pulse .glyph{animation:none}}
</style></head>
<body><main class="shell"><header class="header"><h1>🌧️ 木蘭詩・天降文字雨</h1><div class="sub">第三／四章專用・每章七句隨機抽三句・自由拖曳</div></header>
<section class="panel" id="game"><div class="stats"><span class="pill" id="step">第 1 / 3 題</span><span id="attempt">第 1 次作答</span><span class="pill" id="points">得分 0</span></div><div class="progress"><div id="bar" style="width:0%"></div></div><div class="stage" style="margin-top:12px"><img class="art" id="sceneImage" alt="本題原有插圖"><div><div class="desc">看圖填古文</div><div class="headline" id="sceneName">第一章</div><div class="hintline">按住下落的字，拖到任意空格即可填入；也可先點字再點空格。點已填字可取消。</div><div class="muted" id="blankCount" style="margin-top:8px"></div></div></div><div class="rain" id="rain"><div class="rainLabel">按住文字拖曳到下方空格 ☂</div></div><div class="answer"><h2>📝 自由填字區 <span class="muted">（不限順序；點已填文字可取消）</span></h2><div class="sentence" id="sentence" aria-label="填字句子"></div></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="btn alt" id="restart">↻ 重新抽三題</button><button class="btn alt" id="sound">🔊 音效：開</button><button class="btn" id="assist" hidden>💡 幫我填一字</button></div></section>
<section class="panel end" id="end"><h2>🎉 本章文字雨挑戰完成！</h2><p id="final"></p><button class="btn" id="playAgain">再玩一次（重新抽題）</button><p class="sub">即將返回漫畫回顧。</p></section><div class="footer">《木蘭詩》章節挑戰｜完成後返回原遊戲漫畫回顧</div></main>
<script>
'use strict';
const CHAPTER=Number(new URLSearchParams(location.search).get("chapter"))===3?3:2;
const SCENES=[{"id":1,"text":"唧唧復唧唧，木蘭當戶織。","src":"image/mulan_01.webp"},{"id":2,"text":"不聞機杼聲，惟聞女嘆息。","src":"image/mulan_02.webp"},{"id":3,"text":"問女何所思？問女何所憶？","src":"image/mulan_03.webp"},{"id":4,"text":"女亦無所思，女亦無所憶。","src":"image/mulan_04.webp"},{"id":5,"text":"昨夜見軍帖，可汗大點兵。","src":"image/mulan_05.webp"},{"id":6,"text":"軍書十二卷，卷卷有爺名。","src":"image/mulan_06.webp"},{"id":7,"text":"阿爺無大兒，木蘭無長兄。","src":"image/mulan_07.webp"},{"id":8,"text":"願為市鞍馬，從此替爺征。","src":"image/mulan_08.webp"},{"id":9,"text":"東市買駿馬。","src":"image/mulan_09.webp"},{"id":10,"text":"西市買鞍韉。","src":"image/mulan_10.webp"},{"id":11,"text":"南市買轡頭。","src":"image/mulan_11.webp"},{"id":12,"text":"北市買長鞭。","src":"image/mulan_12.webp"},{"id":13,"text":"朝辭爺孃去，暮宿黃河邊。不聞爺孃喚女聲，但聞黃河流水鳴濺濺。","src":"image/mulan_13.webp"},{"id":14,"text":"旦辭黃河去，暮至黑山頭。不聞爺孃喚女聲，但聞燕山胡騎聲啾啾。","src":"image/mulan_14.webp"},{"id":15,"text":"萬里赴戎機，關山度若飛。","src":"image/mulan_15.webp"},{"id":16,"text":"朔氣傳金柝，寒光照鐵衣。","src":"image/mulan_16.webp"},{"id":17,"text":"將軍百戰死，壯士十年歸。","src":"image/mulan_17.webp"},{"id":18,"text":"歸來見天子，天子坐明堂。","src":"image/mulan_18.webp"},{"id":19,"text":"策勳十二轉，賞賜百千強。","src":"image/mulan_19.webp"},{"id":20,"text":"可汗問所欲，木蘭不用尚書郎。願借明駝千里足，送兒還故鄉。","src":"image/mulan_20.webp"},{"id":21,"text":"爺孃聞女來，出郭相扶將。","src":"image/mulan_21.webp"},{"id":22,"text":"阿姊聞妹來，當戶理紅妝。","src":"image/mulan_22.webp"},{"id":23,"text":"小弟聞姊來，磨刀霍霍向豬羊。","src":"image/mulan_23.webp"},{"id":24,"text":"開我東閣門，坐我西閣床。","src":"image/mulan_24.webp"},{"id":25,"text":"脫我戰時袍，著我舊時裳。","src":"image/mulan_25.webp"},{"id":26,"text":"當窗理雲鬢，對鏡貼花黃。","src":"image/mulan_26.webp"},{"id":27,"text":"出門看伙伴，伙伴皆驚惶：「同行十二年，不知木蘭是女郎。」","src":"image/mulan_27.webp"},{"id":28,"text":"雄兔腳撲朔，雌兔眼迷離。兩兔傍地走，安能辨我是雄雌？","src":"image/mulan_28.webp"}].slice(CHAPTER*7,(CHAPTER+1)*7);
function notify(action, extra={}){parent.postMessage({type:"mulan-hybrid-rain",chapter:CHAPTER,action,...extra},"*")}

const $=s=>document.querySelector(s);
const rain=$('#rain'), answer=$('#sentence'), feedback=$('#feedback');
const PUNCT=/[，。？！：；、：「」『』（）\s]/;
const state={chosen:[],q:0,attempt:1,score:0,filled:{},locked:new Set(),blank:[],pos:[],selectedDrop:null,running:true,sound:true,transition:false,drops:[],lastFrame:0,lastSpawn:0,spawnCount:0};
const distractors=Array.from(new Set(SCENES.map(s=>s.text).join('').split('').filter(ch=>!PUNCT.test(ch))));
let ctx=null, pendingCheck=null, dragging=null;
function chirp(ok=true){if(!state.sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.setValueAtTime(ok?760:250,t);o.frequency.exponentialRampToValueAtTime(ok?1100:175,t+.095);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.14)}catch{}}
const sample=(arr)=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chooseBlanks(txt){const usable=[...txt].map((c,i)=>({c,i})).filter(x=>!PUNCT.test(x.c));const candidates=shuffle(usable.slice());let picks=candidates.slice(0,Math.min(5,Math.max(3,Math.round(usable.length*.30)))).map(x=>x.i).sort((a,b)=>a-b);return picks}
function begin(){cancelDrag();clearSelection();if(pendingCheck){clearTimeout(pendingCheck);pendingCheck=null}state.chosen=shuffle(SCENES.slice()).slice(0,3);state.q=0;state.score=0;$('#game').style.display='block';$('#end').style.display='none';loadQuestion()}
function clearDrops(){cancelDrag();clearSelection();for(const d of state.drops)d.el.remove();state.drops=[];state.lastSpawn=0}
function loadQuestion(){if(pendingCheck){clearTimeout(pendingCheck);pendingCheck=null}clearDrops();state.attempt=1;state.filled={};state.locked=new Set();state.transition=false;const s=state.chosen[state.q];state.blank=chooseBlanks(s.text);state.pos=[...s.text];$('#sceneImage').src=s.src;$('#sceneName').textContent=`第 ${s.id} 句`;feedback.textContent='';render()}
function render(){let s=state.chosen[state.q];$('#step').textContent=`第 ${state.q+1} / 3 題`;$('#attempt').textContent=`第 ${state.attempt} 次作答`;$('#points').textContent=`得分 ${state.score}`;$('#bar').style.width=`${state.q/3*100}%`;$('#blankCount').textContent=`本題 ${state.blank.length} 個空格`;answer.replaceChildren();for(let i=0;i<state.pos.length;i++){const ch=state.pos[i];if(state.blank.includes(i)){const btn=document.createElement('button');btn.className='char slot'+(state.filled[i]!==undefined?' filled':'')+(state.locked.has(i)?' locked':'');btn.type='button';btn.textContent=state.filled[i]??'　';btn.title=state.locked.has(i)?'已答對並鎖定':(state.filled[i]!==undefined?'點擊取消這個字':'等待文字雨填入');btn.disabled=state.transition||state.locked.has(i);btn.dataset.slotIndex=String(i);
btn.addEventListener('click',()=>{
 if(state.transition||state.locked.has(i))return;
 if(state.filled[i]!==undefined){delete state.filled[i];cancelPendingCheck();chirp(false);feedback.textContent='已取消，可重新捕捉文字';render();return}
 if(state.selectedDrop&&state.drops.includes(state.selectedDrop))placeLetter(state.selectedDrop,i);
});answer.append(btn)}else{const span=document.createElement('span');span.className='char'+(PUNCT.test(ch)?' punct':'');span.textContent=ch;answer.append(span)}}$('#assist').hidden=state.attempt<3||state.transition||state.blank.every(i=>state.locked.has(i));}
function cancelPendingCheck(){if(pendingCheck){clearTimeout(pendingCheck);pendingCheck=null}}
function clearSelection(){if(state.selectedDrop?.el)state.selectedDrop.el.classList.remove('selected');state.selectedDrop=null}
function pickLetter(d){if(state.transition)return; if(state.selectedDrop===d){clearSelection();feedback.textContent='已取消選字';return}clearSelection();state.selectedDrop=d;d.el.classList.add('selected');feedback.textContent=`已選「${d.char}」，請點選下方任意空格，或直接拖曳文字`;}
function placeLetter(d,i){if(state.transition||!state.drops.includes(d)||!state.blank.includes(i)||state.locked.has(i)||state.filled[i]!==undefined)return false;
 cancelPendingCheck();state.filled[i]=d.char;removeDrop(d);clearSelection();chirp(true);feedback.textContent=`「${d.char}」已填入空格！`;render();
 if(state.blank.every(x=>state.filled[x]!==undefined)){
  pendingCheck=setTimeout(()=>{pendingCheck=null;state.transition=true;render();check()},1600)
 }
 return true;
}
function cancelDrag(){if(!dragging)return;dragging.ghost?.remove();dragging.d?.el.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));dragging=null}
function slotAt(x,y){const node=document.elementFromPoint(x,y)?.closest('.slot');if(!node||!answer.contains(node)||node.disabled||node.classList.contains('filled'))return null;const i=Number(node.dataset.slotIndex);return Number.isInteger(i)?{node,i}:null}
function startDropPointer(e,d){if(state.transition||e.button>0)return;e.preventDefault();clearSelection();d.el.setPointerCapture?.(e.pointerId);
 dragging={d,id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,active:false,ghost:null};}
function moveDropPointer(e,d){if(!dragging||dragging.id!==e.pointerId||dragging.d!==d)return;e.preventDefault();let drag=dragging;drag.x=e.clientX;drag.y=e.clientY;
 if(!drag.active&&Math.hypot(drag.x-drag.x0,drag.y-drag.y0)>7){drag.active=true;d.el.classList.add('dragging');drag.ghost=document.createElement('div');drag.ghost.className='drag-ghost';drag.ghost.textContent=d.char;document.body.append(drag.ghost)}
 if(!drag.active)return;
 drag.ghost.style.left=drag.x+'px';drag.ghost.style.top=drag.y+'px';
 // 手機畫面不足以同時看見文字雨與填字區時，自動向下捲動。
 if(drag.y>window.innerHeight-58&&window.scrollY+window.innerHeight<document.documentElement.scrollHeight-2)window.scrollBy(0,7);
 if(drag.y<55&&window.scrollY>0)window.scrollBy(0,-7);
 const target=slotAt(drag.x,drag.y);
 document.querySelectorAll('.drop-target').forEach(el=>{if(el!==target?.node)el.classList.remove('drop-target')});target?.node.classList.add('drop-target');
}
function endDropPointer(e,d){if(!dragging||dragging.id!==e.pointerId||dragging.d!==d)return;e.preventDefault();const wasDrag=dragging.active, where=wasDrag?slotAt(e.clientX,e.clientY):null;cancelDrag();if(where){placeLetter(d,where.i)}else if(!wasDrag){pickLetter(d)}else{feedback.textContent='未放入空格，文字繼續下落';}}

function check(){const s=state.chosen[state.q], newly=[];let wrong=0;for(const i of state.blank){if(state.locked.has(i))continue;if(state.filled[i]===state.pos[i]){state.locked.add(i);newly.push(i)}else{delete state.filled[i];wrong++}}
const each=state.attempt===1?10:state.attempt===2?5:2;const add=newly.length*each;state.score+=add;notify("points",{points:add,attempt:state.attempt,wrong});if(wrong>0 || state.attempt>1)notify("nonperfect");
if(state.blank.every(i=>state.locked.has(i))){feedback.textContent=`✅ 全部正確！本次 +${add} 分`;state.transition=true;render();setTimeout(advance,1300);return}
if(state.attempt>=5){notify("nonperfect");for(const i of state.blank){if(!state.locked.has(i)){state.filled[i]=state.pos[i];state.locked.add(i)}}feedback.textContent=`第 5 次仍有錯誤，系統已補齊剩餘答案。本次 +${add} 分`;render();setTimeout(advance,1900);return}
state.attempt++;state.transition=false;feedback.textContent=`本輪 +${add} 分；${newly.length} 字正確保留、${wrong} 字清空，繼續捕捉！`;render();}
function advance(){clearSelection();state.q++;if(state.q>=3){clearDrops();$('#game').style.display='none';$('#end').style.display='block';$('#final').textContent=`三題完成，本章文字雨得分 ${state.score} 分。`;notify('complete',{score:state.score});return}loadQuestion()}
function assist(){if(state.attempt<3||state.transition)return;const i=state.blank.find(x=>!state.locked.has(x));if(i===undefined)return;state.filled[i]=state.pos[i];state.locked.add(i);notify("nonperfect");feedback.textContent=`💡 已協助填入「${state.pos[i]}」，這一字不計分。`;chirp(true);render();if(state.blank.every(x=>state.locked.has(x))){state.transition=true;render();setTimeout(advance,1100)}else if(state.blank.every(x=>state.filled[x]!==undefined)){render();if(pendingCheck)clearTimeout(pendingCheck);pendingCheck=setTimeout(()=>{pendingCheck=null;state.transition=true;render();check()},1400)}}
function removeDrop(d){if(state.selectedDrop===d)clearSelection();if(dragging?.d===d)cancelDrag();const idx=state.drops.indexOf(d);if(idx>=0)state.drops.splice(idx,1);d.el.remove()}
function spawn(){if(state.transition||state.drops.length>=22)return;const missing=state.blank.filter(i=>!state.locked.has(i)&&state.filled[i]===undefined).map(i=>state.pos[i]);if(!missing.length)return;const ch=Math.random()<.64?sample(missing):sample(distractors);const el=document.createElement('button');el.type='button';el.className='drop'+(Math.random()<.27?' pulse':'');const inner=document.createElement('span');inner.className='glyph';inner.textContent=ch;el.appendChild(inner);const palette=['#a2d9ff','#f4ce83','#abedbe','#e5b7f3','#f3abb9','#e7e9f6'];el.style.color=sample(palette);el.style.background='rgba(255,255,255,.09)';const W=rain.clientWidth,H=rain.clientHeight, speed=40+Math.random()*95,angle=(Math.random()-.5)*.76, vx=Math.sin(angle)*speed,vy=Math.cos(angle)*speed, x=Math.random()*(W-48),y=-50;const d={el,x,y,vx,vy,char:ch};el.addEventListener('pointerdown',e=>startDropPointer(e,d));el.addEventListener('pointermove',e=>moveDropPointer(e,d));el.addEventListener('pointerup',e=>endDropPointer(e,d));el.addEventListener('pointercancel',()=>cancelDrag());rain.append(el);state.drops.push(d)}
function frame(ts){const dt=Math.min(.05,(ts-(state.lastFrame||ts))/1000);state.lastFrame=ts;if(!document.hidden&&$('#game').style.display!=='none'){state.lastSpawn+=dt;if(state.lastSpawn>.48){state.lastSpawn=0;spawn()}for(const d of [...state.drops]){if(dragging?.d===d||state.selectedDrop===d)continue;d.x+=d.vx*dt;d.y+=d.vy*dt;d.el.style.transform=`translate3d(${d.x}px,${d.y}px,0)`;if(d.y>rain.clientHeight+65||d.x>rain.clientWidth+65||d.x< -65)removeDrop(d)}}requestAnimationFrame(frame)}
$('#restart').onclick=begin;$('#playAgain').onclick=begin;$('#assist').onclick=assist;$('#sound').onclick=()=>{state.sound=!state.sound;$('#sound').textContent=state.sound?'🔊 音效：開':'🔇 音效：關'};
begin();requestAnimationFrame(frame);
if(window.ResizeObserver){new ResizeObserver(()=>notify("height",{height:document.documentElement.scrollHeight})).observe(document.body)}
window.addEventListener("load",()=>notify("height",{height:document.documentElement.scrollHeight}));
</script></body></html>
